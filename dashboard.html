<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tifa Inventory — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --pistachio: #8FAE5D;
    --pistachio-dark: #6E8C3E;
    --pistachio-deep: #3F5222;
    --pistachio-tint: #EEF3E1;
    --cream: #FBF9F3;
    --amber: #C9862B;
    --error: #A34848;
    --error-deep: #791F1F;
    --border: #E7E2D3;
    --muted: #8A8973;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
    color: var(--pistachio-deep);
  }

  header {
    background: var(--pistachio-deep);
    color: white;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 50%; background: var(--pistachio);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif; font-weight: 700; font-size: 16px;
  }
  .brand-title { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 17px; }

  #logoutBtn {
    background: transparent; border: 1px solid rgba(255,255,255,0.3); color: white;
    padding: 8px 16px; border-radius: 6px; font-family: 'DM Sans', sans-serif;
    font-size: 13px; cursor: pointer;
  }
  #logoutBtn:hover { background: rgba(255,255,255,0.08); }

  .layout {
    max-width: 1440px; margin: 0 auto; padding: 28px 24px 80px;
    display: grid; grid-template-columns: 1fr 340px; gap: 24px; align-items: start;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static !important; order: -1; }
  }

  .page-top {
    display: flex; justify-content: space-between; align-items: flex-end;
    flex-wrap: wrap; gap: 12px; margin-bottom: 18px;
  }
  .page-title { font-family: 'Playfair Display', serif; font-size: 27px; margin: 0 0 4px; }
  .page-subtitle { color: var(--muted); font-size: 13.5px; margin: 0; }

  .toggle-all-btn {
    background: white; border: 1px solid var(--border); color: var(--pistachio-deep);
    padding: 8px 14px; border-radius: 7px; font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .toggle-all-btn:hover { background: #F5F2E8; }

  /* Stats strip */
  .stats-strip {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px;
  }
  @media (max-width: 700px) { .stats-strip { grid-template-columns: repeat(2, 1fr); } }
  .stat-card { border-radius: 12px; padding: 14px 16px; }
  .stat-card.neutral { background: white; border: 1px solid var(--border); }
  .stat-card.warn { background: #F2E9E9; }
  .stat-card.critical { background: var(--error-deep); }
  .stat-label { font-size: 11.5px; margin-bottom: 4px; }
  .stat-card.neutral .stat-label { color: var(--muted); }
  .stat-card.warn .stat-label { color: var(--error); }
  .stat-card.critical .stat-label { color: #F0C5C5; }
  .stat-value { font-size: 22px; font-weight: 500; font-family: 'Playfair Display', serif; }
  .stat-card.neutral .stat-value { color: var(--pistachio-deep); }
  .stat-card.warn .stat-value { color: var(--error-deep); }
  .stat-card.critical .stat-value { color: white; }

  .search-row { margin-bottom: 18px; position: relative; }
  .search-row input {
    width: 100%; padding: 11px 14px 11px 38px; border: 1.5px solid var(--border);
    border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 14px; background: white;
  }
  .search-row input:focus { outline: none; border-color: var(--pistachio); }
  .search-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    font-size: 16px; color: var(--muted); pointer-events: none;
  }

  /* Category card grid */
  .category-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  @media (max-width: 640px) { .category-grid { grid-template-columns: 1fr; } }

  .category-card {
    background: white; border-radius: 12px; border: 1px solid var(--border);
    overflow: hidden; grid-column: span 1;
  }
  .category-card.expanded { grid-column: 1 / -1; }
  .category-card.hidden-by-search { display: none; }

  .category-toggle {
    width: 100%; padding: 15px 16px; background: white; border: none; cursor: pointer;
    text-align: left; font-family: 'DM Sans', sans-serif; display: block;
  }
  .category-toggle:hover { background: #FAFAF5; }

  .category-toggle-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .category-toggle-left { display: flex; align-items: center; gap: 9px; }
  .category-icon { font-size: 18px; color: var(--pistachio-dark); }
  .category-name { font-size: 13.5px; font-weight: 500; color: var(--pistachio-deep); }
  .chevron { font-size: 15px; color: var(--muted); transition: transform 0.15s ease; }
  .category-card.expanded .chevron { transform: rotate(90deg); }

  .category-meta { font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
  .category-meta .low-count { color: var(--error-deep); font-weight: 600; }

  .health-bar { display: flex; height: 6px; border-radius: 4px; overflow: hidden; background: var(--pistachio-tint); }
  .health-bar .ok-seg { background: var(--pistachio); }
  .health-bar .low-seg { background: #D85A30; }

  .category-table-wrap { display: none; border-top: 1px solid var(--border); }
  .category-card.expanded .category-table-wrap { display: block; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 16px; font-size: 13px; border-bottom: 1px solid var(--border); }
  th {
    font-weight: 600; color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.04em; background: #F7F5EC;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #FAFAF5; }
  tr.row-hidden-by-search { display: none; }

  .status-pill {
    display: inline-block; font-size: 10.5px; font-weight: 600; padding: 3px 8px;
    border-radius: 20px; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .status-active { background: var(--pistachio-tint); color: var(--pistachio-dark); }
  .status-low { background: #F2E9E9; color: var(--error-deep); }
  .status-zero { background: var(--error-deep); color: white; }
  .status-seasonal { background: rgba(201,134,43,0.12); color: var(--amber); }
  .status-hold, .status-trial { background: #EEEDE4; color: var(--muted); }

  .current-cell { display: flex; align-items: center; gap: 7px; }
  .edit-btn {
    background: none; border: none; cursor: pointer; padding: 4px;
    color: var(--muted); border-radius: 5px; display: inline-flex; align-items: center; font-size: 13px;
  }
  .edit-btn:hover { background: #EEEDE4; color: var(--pistachio-deep); }

  .edit-input-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .edit-input-row input {
    width: 100px; padding: 6px 8px; border: 1.5px solid var(--pistachio); border-radius: 6px;
    font-family: 'DM Sans', sans-serif; font-size: 13px;
  }
  .edit-save, .edit-cancel { border: none; border-radius: 6px; padding: 6px 9px; font-size: 11.5px; font-weight: 600; cursor: pointer; }
  .edit-save { background: var(--pistachio); color: white; }
  .edit-save:hover { background: var(--pistachio-dark); }
  .edit-cancel { background: #EEEDE4; color: var(--muted); }
  .edit-cancel:hover { background: #E4E2D6; }

  .empty-state { text-align: center; padding: 80px 20px; color: var(--muted); }
  .empty-state h2 { font-family: 'Playfair Display', serif; color: var(--pistachio-deep); font-size: 22px; margin-bottom: 8px; }

  .sidebar {
    position: sticky; top: 20px; background: white; border-radius: 12px;
    border: 1px solid var(--border); overflow: hidden;
    max-height: calc(100vh - 40px); display: flex; flex-direction: column;
  }
  .sidebar-header { background: var(--pistachio-deep); color: white; padding: 16px 18px; }
  .sidebar-header h2 { font-family: 'Playfair Display', serif; font-size: 16.5px; margin: 0 0 3px; }
  .sidebar-header p { margin: 0; font-size: 12px; color: rgba(255,255,255,0.7); }
  .sidebar-body { overflow-y: auto; flex: 1; padding: 6px 0; }
  .sidebar-empty { padding: 36px 20px; text-align: center; color: var(--muted); font-size: 13px; }
  .sidebar-empty i { font-size: 30px; margin-bottom: 10px; color: var(--pistachio); display: block; }
  .sidebar-group-label {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--muted); padding: 12px 18px 4px;
  }
  .sidebar-item { padding: 10px 18px; border-bottom: 1px solid #F2F0E6; }
  .sidebar-item-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .sidebar-item-name { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .sidebar-item-value { font-size: 11.5px; font-weight: 700; color: var(--error-deep); white-space: nowrap; }
  .sidebar-item-value.zero-value { background: var(--error-deep); color: white; padding: 2px 7px; border-radius: 10px; }
  .sidebar-edit-btn {
    background: none; border: 1px solid var(--border); cursor: pointer;
    padding: 3px 9px; color: var(--muted); border-radius: 6px; font-size: 11px;
    margin-top: 6px; font-family: 'DM Sans', sans-serif; font-weight: 600;
  }
  .sidebar-edit-btn:hover { background: #F7F5EC; color: var(--pistachio-deep); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(63,82,34,0.5);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal-overlay.visible { display: flex; }
  .modal {
    background: var(--cream); border-radius: 14px; max-width: 460px; width: 100%;
    max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(0,0,0,0.25);
  }
  .modal-header { padding: 22px 26px 14px; border-bottom: 1px solid var(--border); }
  .modal-header h2 { font-family: 'Playfair Display', serif; font-size: 20px; margin: 0 0 4px; color: var(--error-deep); }
  .modal-header p { margin: 0; font-size: 13px; color: var(--muted); }
  .modal-body { padding: 6px 26px; overflow-y: auto; }
  .alert-item { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .alert-item:last-child { border-bottom: none; }
  .alert-item-name { font-weight: 600; font-size: 13.5px; }
  .alert-item-cat { font-size: 11.5px; color: var(--muted); }
  .alert-item-value { font-size: 12.5px; color: var(--error-deep); font-weight: 600; white-space: nowrap; }
  .modal-footer { padding: 16px 26px 22px; }
  .modal-footer button {
    width: 100%; padding: 12px; border: none; border-radius: 8px;
    background: var(--pistachio-deep); color: white; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .modal-footer button:hover { background: #2E3B18; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--pistachio-deep); color: white; padding: 12px 20px; border-radius: 8px;
    font-size: 13.5px; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 200;
  }
  .toast.visible { opacity: 1; }
  .toast.error-toast { background: var(--error-deep); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">T</div>
    <div class="brand-title">Tifa Inventory</div>
  </div>
  <button id="logoutBtn">Sign out</button>
</header>

<div class="layout">
  <div class="main-col">
    <div class="page-top">
      <div>
        <h1 class="page-title">Inventory</h1>
        <p class="page-subtitle" id="pageSubtitle">Loading…</p>
      </div>
      <button class="toggle-all-btn" id="toggleAllBtn">Expand all</button>
    </div>

    <div class="stats-strip" id="statsStrip"></div>

    <div class="search-row">
      <i class="ti ti-search search-icon"></i>
      <input type="text" id="searchInput" placeholder="Search items by name…" />
    </div>

    <div class="category-grid" id="content"></div>
  </div>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Reorder list</h2>
      <p id="sidebarSubtitle">Loading…</p>
    </div>
    <div class="sidebar-body" id="sidebarBody"></div>
  </aside>
</div>

<div class="modal-overlay" id="alertOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2>Items need reordering</h2>
      <p>Full list is also pinned on the right side of your dashboard.</p>
    </div>
    <div class="modal-body" id="alertList"></div>
    <div class="modal-footer">
      <button id="dismissAlert">Got it</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = "https://ozrnoorbyiyjpngdffdm.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_TRs7-22RYtwvDtuRaDcdwQ_KRxMzw8G";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const content = document.getElementById('content');
  const pageSubtitle = document.getElementById('pageSubtitle');
  const alertOverlay = document.getElementById('alertOverlay');
  const alertList = document.getElementById('alertList');
  const toggleAllBtn = document.getElementById('toggleAllBtn');
  const toastEl = document.getElementById('toast');
  const searchInput = document.getElementById('searchInput');
  const sidebarBody = document.getElementById('sidebarBody');
  const sidebarSubtitle = document.getElementById('sidebarSubtitle');
  const statsStrip = document.getElementById('statsStrip');

  let allItems = [];
  let expandedState = {};
  let searchTerm = '';

  const CATEGORY_ICONS = {
    'Gelato': 'ti-ice-cream',
    'Gelato Supplies': 'ti-package',
    'Gelato/Drink/Pastry/Chocolate Supplies': 'ti-shopping-bag',
    'Covertures, Waffle Mix, Coffee, Water & Soda': 'ti-coffee',
    'Truffles & Chocolates': 'ti-candy',
    'Cookies & Pastries': 'ti-cookie',
    'House Supplies': 'ti-home',
  };
  function iconFor(category) {
    return CATEGORY_ICONS[category] || 'ti-box';
  }

  (async function checkAuth() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) {
      window.location.href = 'login.html';
      return;
    }
    loadDashboard();
  })();

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
  });

  document.getElementById('dismissAlert').addEventListener('click', () => {
    alertOverlay.classList.remove('visible');
  });

  function showToast(msg, isError) {
    toastEl.textContent = msg;
    toastEl.className = 'toast visible' + (isError ? ' error-toast' : '');
    setTimeout(() => { toastEl.classList.remove('visible'); }, 2600);
  }

  function parseValue(text) {
    if (!text) return null;
    const match = text.match(/-?\d+(\.\d+)?/);
    return match ? parseFloat(match[0]) : null;
  }

  function needsReorder(item) {
    const val = parseValue(item.current_value);
    if (val === null) return false;
    if (val <= 0) return true;
    if (item.par_level !== null && item.par_level !== undefined && val <= item.par_level) return true;
    return false;
  }

  function isZero(item) {
    const val = parseValue(item.current_value);
    return val !== null && val <= 0;
  }

  async function loadDashboard() {
    const { data: items, error } = await supabaseClient
      .from('inventory_items')
      .select('*')
      .neq('status', 'discontinued')
      .order('category')
      .order('name');

    if (error) {
      pageSubtitle.textContent = 'Something went wrong loading inventory.';
      content.innerHTML = `<div class="empty-state"><h2>Couldn't load items</h2><p>${error.message}</p></div>`;
      return;
    }

    if (!items || items.length === 0) {
      pageSubtitle.textContent = 'No items yet.';
      content.innerHTML = `
        <div class="empty-state">
          <h2>No inventory items yet</h2>
          <p>Once your item list is imported, it'll show up here.</p>
        </div>`;
      sidebarSubtitle.textContent = 'Nothing to reorder yet.';
      return;
    }

    allItems = items;
    const catCount = new Set(items.map(i => i.category)).size;
    pageSubtitle.textContent = `${items.length} item${items.length === 1 ? '' : 's'} across ${catCount} categories.`;

    renderStats();
    render();
    renderSidebar();
    maybeShowAlert();
  }

  function renderStats() {
    const catCount = new Set(allItems.map(i => i.category)).size;
    const toReorder = allItems.filter(needsReorder).length;
    const outOfStock = allItems.filter(isZero).length;

    statsStrip.innerHTML = `
      <div class="stat-card neutral">
        <div class="stat-label">Total items</div>
        <div class="stat-value">${allItems.length}</div>
      </div>
      <div class="stat-card neutral">
        <div class="stat-label">Categories</div>
        <div class="stat-value">${catCount}</div>
      </div>
      <div class="stat-card warn">
        <div class="stat-label">To reorder</div>
        <div class="stat-value">${toReorder}</div>
      </div>
      <div class="stat-card critical">
        <div class="stat-label">Out of stock</div>
        <div class="stat-value">${outOfStock}</div>
      </div>
    `;
  }

  function escapeAttr(str) {
    return String(str).replace(/"/g, '&quot;');
  }

  function render() {
    const grouped = {};
    for (const item of allItems) {
      if (!grouped[item.category]) grouped[item.category] = [];
      grouped[item.category].push(item);
    }

    let html = '';
    for (const category of Object.keys(grouped)) {
      const catItems = grouped[category];
      const lowCount = catItems.filter(needsReorder).length;
      const okCount = catItems.length - lowCount;
      const okPct = catItems.length ? Math.round((okCount / catItems.length) * 100) : 100;
      const isExpanded = !!expandedState[category] || searchTerm.length > 0;

      html += `<div class="category-card ${isExpanded ? 'expanded' : ''}" data-category="${escapeAttr(category)}">
        <button class="category-toggle" data-toggle-category="${escapeAttr(category)}">
          <div class="category-toggle-top">
            <div class="category-toggle-left">
              <i class="ti ${iconFor(category)} category-icon" aria-hidden="true"></i>
              <span class="category-name">${category}</span>
            </div>
            <i class="ti ti-chevron-right chevron" aria-hidden="true"></i>
          </div>
          <div class="category-meta">${catItems.length} items${lowCount > 0 ? ` · <span class="low-count">${lowCount} to reorder</span>` : ''}</div>
          <div class="health-bar">
            <div class="ok-seg" style="width:${okPct}%"></div>
            <div class="low-seg" style="width:${100 - okPct}%"></div>
          </div>
        </button>
        <div class="category-table-wrap">
          <table>
            <thead>
              <tr><th>Item</th><th>Current</th><th>Threshold</th><th>Status</th></tr>
            </thead>
            <tbody>`;

      for (const item of catItems) {
        const reorder = needsReorder(item);
        const zero = isZero(item);
        const statusLabel = zero ? 'Out of stock' : (reorder ? 'Low stock' : item.status);
        const statusClass = zero ? 'status-zero' : (reorder ? 'status-low' : `status-${item.status}`);
        const matchesSearch = !searchTerm || item.name.toLowerCase().includes(searchTerm);

        html += `<tr data-item-id="${item.id}" class="${matchesSearch ? '' : 'row-hidden-by-search'}">
          <td>${item.name}</td>
          <td>
            <div class="current-cell" data-current-cell="${item.id}">
              <span data-current-display="${item.id}">${item.current_value ?? '—'}</span>
              <button class="edit-btn" data-edit-btn="${item.id}" title="Update quantity">
                <i class="ti ti-edit" aria-hidden="true"></i>
              </button>
            </div>
          </td>
          <td>${item.par_level ?? '—'}</td>
          <td><span class="status-pill ${statusClass}">${statusLabel}</span></td>
        </tr>`;
      }

      html += `</tbody></table></div></div>`;
    }

    content.innerHTML = html;

    if (searchTerm) {
      document.querySelectorAll('.category-card').forEach(block => {
        const visibleRows = block.querySelectorAll('tbody tr:not(.row-hidden-by-search)');
        block.classList.toggle('hidden-by-search', visibleRows.length === 0);
      });
    }

    attachCategoryToggleHandlers();
    attachEditHandlers('main');
  }

  function renderSidebar() {
    const reorderItems = allItems.filter(needsReorder);
    sidebarSubtitle.textContent = reorderItems.length === 0
      ? 'Nothing needs reordering right now.'
      : `${reorderItems.length} item${reorderItems.length === 1 ? '' : 's'} need attention.`;

    if (reorderItems.length === 0) {
      sidebarBody.innerHTML = `
        <div class="sidebar-empty">
          <i class="ti ti-circle-check" aria-hidden="true"></i>
          <div>All stocked up.</div>
        </div>`;
      return;
    }

    const grouped = {};
    for (const item of reorderItems) {
      if (!grouped[item.category]) grouped[item.category] = [];
      grouped[item.category].push(item);
    }

    let html = '';
    for (const category of Object.keys(grouped)) {
      html += `<div class="sidebar-group-label">${category}</div>`;
      for (const item of grouped[category]) {
        const zero = isZero(item);
        html += `<div class="sidebar-item" data-sidebar-item="${item.id}">
          <div class="sidebar-item-top">
            <div class="sidebar-item-name">${item.name}</div>
            <div class="sidebar-item-value ${zero ? 'zero-value' : ''}">${zero ? 'OUT' : (item.current_value ?? '—')}</div>
          </div>
          <button class="sidebar-edit-btn" data-edit-btn="${item.id}">Update</button>
        </div>`;
      }
    }
    sidebarBody.innerHTML = html;
    attachEditHandlers('sidebar');
  }

  function attachCategoryToggleHandlers() {
    document.querySelectorAll('[data-toggle-category]').forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.getAttribute('data-toggle-category');
        expandedState[cat] = !expandedState[cat];
        render();
      });
    });
  }

  function attachEditHandlers(context) {
    const scope = context === 'sidebar' ? sidebarBody : content;
    scope.querySelectorAll('[data-edit-btn]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        openEditor(btn.getAttribute('data-edit-btn'), context);
      });
    });
  }

  function openEditor(itemId, context) {
    const item = allItems.find(i => String(i.id) === String(itemId));
    if (!item) return;

    if (context === 'sidebar') {
      const row = document.querySelector(`[data-sidebar-item="${itemId}"]`);
      if (!row) return;
      row.innerHTML = `
        <div class="edit-input-row">
          <input type="text" id="editInput_sb_${itemId}" value="${item.current_value ? escapeAttr(item.current_value) : ''}" />
          <button class="edit-save" data-save="${itemId}">Save</button>
          <button class="edit-cancel" data-cancel="${itemId}">Cancel</button>
        </div>`;
      const input = document.getElementById(`editInput_sb_${itemId}`);
      input.focus(); input.select();
      row.querySelector('[data-save]').addEventListener('click', () => saveEdit(itemId));
      row.querySelector('[data-cancel]').addEventListener('click', () => renderSidebar());
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') saveEdit(itemId);
        if (e.key === 'Escape') renderSidebar();
      });
    } else {
      const cell = document.querySelector(`[data-current-cell="${itemId}"]`);
      if (!cell) return;
      cell.innerHTML = `
        <div class="edit-input-row">
          <input type="text" id="editInput_${itemId}" value="${item.current_value ? escapeAttr(item.current_value) : ''}" />
          <button class="edit-save" data-save="${itemId}">Save</button>
          <button class="edit-cancel" data-cancel="${itemId}">Cancel</button>
        </div>`;
      const input = document.getElementById(`editInput_${itemId}`);
      input.focus(); input.select();
      cell.querySelector('[data-save]').addEventListener('click', () => saveEdit(itemId));
      cell.querySelector('[data-cancel]').addEventListener('click', () => render());
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') saveEdit(itemId);
        if (e.key === 'Escape') render();
      });
    }
  }

  async function saveEdit(itemId) {
    const input = document.getElementById(`editInput_${itemId}`) || document.getElementById(`editInput_sb_${itemId}`);
    const newValue = input.value.trim();
    if (newValue === '') {
      showToast('Enter a value before saving.', true);
      return;
    }

    const { error: updateError } = await supabaseClient
      .from('inventory_items')
      .update({ current_value: newValue })
      .eq('id', itemId);

    if (updateError) {
      showToast('Could not save: ' + updateError.message, true);
      return;
    }

    const { error: logError } = await supabaseClient
      .from('inventory_counts')
      .insert({
        item_id: itemId,
        recorded_value: newValue,
        recorded_at: new Date().toISOString(),
        recorded_by: null,
        source: 'manual',
      });

    if (logError) {
      showToast('Saved, but history log failed: ' + logError.message, true);
    } else {
      showToast('Updated.');
    }

    const item = allItems.find(i => String(i.id) === String(itemId));
    if (item) item.current_value = newValue;
    renderStats();
    render();
    renderSidebar();
  }

  function maybeShowAlert() {
    const lowItems = allItems.filter(needsReorder);
    if (lowItems.length > 0) {
      alertList.innerHTML = lowItems.map(item => `
        <div class="alert-item">
          <div>
            <div class="alert-item-name">${item.name}</div>
            <div class="alert-item-cat">${item.category}</div>
          </div>
          <div class="alert-item-value">${isZero(item) ? 'OUT' : (item.current_value ?? '—')}${item.par_level != null ? ' / threshold ' + item.par_level : ''}</div>
        </div>
      `).join('');
      alertOverlay.classList.add('visible');
    }
  }

  let allExpanded = false;
  toggleAllBtn.addEventListener('click', () => {
    allExpanded = !allExpanded;
    const categories = new Set(allItems.map(i => i.category));
    categories.forEach(cat => { expandedState[cat] = allExpanded; });
    toggleAllBtn.textContent = allExpanded ? 'Collapse all' : 'Expand all';
    render();
  });

  searchInput.addEventListener('input', (e) => {
    searchTerm = e.target.value.trim().toLowerCase();
    render();
  });
</script>

</body>
</html>
